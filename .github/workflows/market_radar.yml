name: "US Market Radar 24-7 Engine"

on:
  schedule:
    # 1. 🌌 亚太日间与美股夜盘前半场 (美东 20:00~00:00 / 韩国 09:00~13:00，常驻 240分钟，⚡ 每 2 分钟极速守护)
    - cron: '0 0 * * 1-5'
    # 2. 🌌 亚太日间与美股夜盘后半场 (美东 00:00~04:00 / 韩国 13:00~17:00，常驻 240分钟，⚡ 每 2 分钟极速守护)
    - cron: '0 4 * * 1-5'
    # 3. 🌙 美股盘前早班车抢跑 (美东 04:00~08:00 / 韩国 17:00~21:00，常驻 240分钟，🔥 每 1 分钟极速轮询)
    - cron: '0 8 * * 1-5'
    # 4. 🔥 盘前冲刺 + 常规早盘 (美东 08:00~12:00 / 韩国 21:00~01:00，常驻 240分钟，🔥 每 1 分钟极速轮询)
    - cron: '0 12 * * 1-5'
    # 5. 🎯 午盘 + 尾盘冲刺 (美东 12:00~16:30 / 韩国 01:00~05:30，常驻 270分钟，🔥 每 1 分钟极速轮询)
    - cron: '0 16 * * 1-5'
    # 6. 🌙 盘后重头戏与业绩电话会 (美东 16:30~20:00 / 韩国 05:30~09:00，常驻 210分钟，🔥 每 1 分钟捕捉财报盘后暴涨暴跌)
    - cron: '30 20 * * 1-5'
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: '持续运行分钟数'
        required: false
        default: '60'
        type: string
      interval_seconds:
        description: '每轮轮询间隔秒数 (默认 60s，夜盘推荐 120s)'
        required: false
        default: '60'
        type: string

concurrency:
  group: us-market-radar
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  radar-scan:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python 3.10 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装量化与数据分析依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🛡️ 本地优先检测 (本地活跃时云端避让防限流与冲突)
        id: check_local
        run: |
          LAST_COMMIT_TS=$(git log -1 --format=%ct)
          NOW_TS=$(date +%s)
          DIFF_SEC=$((NOW_TS - LAST_COMMIT_TS))
          echo "距上次实盘推送时间: ${DIFF_SEC} 秒"
          if [ "$DIFF_SEC" -lt 600 ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::notice ::✅ 本地守护进程正在活跃运行中 (最近推送于 ${DIFF_SEC}s 前)，云端定时任务自动避让，规避 429 API 限流与重复告警。"
            echo "skip_run=true" >> $GITHUB_OUTPUT
          else
            echo "skip_run=false" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 执行全市场 65 只标的极速扫描与微信告警
        if: steps.check_local.outputs.skip_run != 'true'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          DURATION="${{ github.event.inputs.duration_minutes }}"
          [ -z "$DURATION" ] && DURATION="240"
          INTERVAL="${{ github.event.inputs.interval_seconds }}"
          [ -z "$INTERVAL" ] && INTERVAL="60"
          # 如果是夜盘亚太时段 (UTC 00:00~08:00 / 韩国 09:00~17:00)，自适应切为 2 分钟 (120s) 巡检守护
          if [ "${{ github.event.schedule }}" = "0 0 * * 1-5" ] || [ "${{ github.event.schedule }}" = "0 4 * * 1-5" ]; then
            INTERVAL="120"
          fi
          python integrated_market_radar.py --loop-daemon --duration-minutes $DURATION --interval-seconds $INTERVAL
