name: US Market Radar 24/7 Engine (All Sessions: Pre, Regular, Post & Night)

on:
  schedule:
    # 1. 🌙 美股盘前早班车 (美东 04:00~08:00 / 韩国 17:00~21:00，每 15 分钟巡检盘前抢跑)
    - cron: '*/15 8-11 * * 1-5'
    # 2. 🔥 盘前冲刺 + 常规早盘 (美东 08:00~12:00 / 韩国 21:00~01:00，常驻 240 分钟，每 60 秒极速轮询)
    - cron: '0 12 * * 1-5'
    # 3. 🎯 午盘 + 尾盘冲刺 + 盘后巨头财报首发 (美东 12:00~16:30 / 韩国 01:00~05:30，常驻 270 分钟，每 60 秒极速轮询)
    - cron: '0 16 * * 1-5'
    # 4. 🌙 盘后重头戏与业绩电话会 (美东 16:30~20:00 / 韩国 05:30~09:00，常驻 210 分钟，每 60 秒捕捉财报盘后暴涨暴跌)
    - cron: '30 20 * * 1-5'
    # 5. 🌌 夜盘与亚太日间时段 (美东 20:00~04:00 / 韩国 09:00~17:00，每 1 小时自动定时巡检)
    - cron: '0 0,1,2,3,4,5,6,7 * * *'
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: '持续运行分钟数 (每 60 秒极速扫描并推微信)'
        required: false
        default: '60'

permissions:
  contents: write

jobs:
  radar-scan:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 设置 Python 3.10 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装量化与数据分析依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 执行全市场 58 只标的极速扫描与微信告警
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          DURATION="${{ github.event.inputs.duration_minutes || '240' }}"
          # 判断如果是定点简易巡检还是盘中常驻守护
          if [ "${{ github.event_name }}" = "schedule" ] && ( [ "${{ github.event.schedule }}" = "0 0,1,2,3,4,5,6,7 * * *" ] || [ "${{ github.event.schedule }}" = "*/15 8-11 * * 1-5" ] ); then
            python integrated_market_radar.py --once
            git add index.html futu_pro_terminal.html .terminal_notifications.json .options_cache.json .radar_alert_history.json || true
            git diff --quiet && git diff --staged --quiet || (git commit -m "⚡ [自动更新] 盘前/夜盘定时巡检完成 [skip ci]" && git push)
          else
            python integrated_market_radar.py --loop-daemon --duration-minutes $DURATION
          fi
