name: "US Market Radar 24-7 Engine"

on:
  schedule:
    # 1. 🌌 亚太日间与美股夜盘前半场 (美东 20:00~00:00 / 韩国 09:00~13:00，常驻 240分钟，⚡ 每 2 分钟极速守护)
    - cron: '0 0 * * 1-5'
    # 2. 🌌 亚太日间与美股夜盘后半场 (美东 00:00~04:00 / 韩国 13:00~17:00，常驻 240分钟，⚡ 每 2 分钟极速守护)
    - cron: '0 4 * * 1-5'
    # 3. 🌙 美股盘前早班车抢跑 (美东 04:00~08:00 / 韩国 17:00~21:00，常驻 240分钟，🔥 每 1 分钟极速轮询)
    - cron: '0 8 * * 1-5'
    # 4. 🔥 盘前冲刺 + 常规早盘 (美东 08:00~12:00 / 韩国 21:00~01:00，常驻 240分钟，🔥 每 1 分钟极速轮询)
    - cron: '0 12 * * 1-5'
    # 5. 🎯 午盘 + 尾盘冲刺 (美东 12:00~16:30 / 韩国 01:00~05:30，常驻 270分钟，🔥 每 1 分钟极速轮询)
    - cron: '0 16 * * 1-5'
    # 6. 🌙 盘后重头戏与业绩电话会 (美东 16:30~20:00 / 韩国 05:30~09:00，常驻 210分钟，🔥 每 1 分钟捕捉财报盘后暴涨暴跌)
    - cron: '30 20 * * 1-5'
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: '持续运行分钟数。0 = 只跑一轮并发布 Pages（手动默认）。填正整数则按该时长守护。定时任务忽略此值，仍跑 240 分钟。'
        required: false
        default: '0'
        type: string
      interval_seconds:
        description: '每轮轮询间隔秒数 (默认 60s，夜盘推荐 120s)'
        required: false
        default: '60'
        type: string

concurrency:
  group: us-market-radar
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  # Official Pages publish with the workflow's own GITHUB_TOKEN. No PAT.
  pages: write
  id-token: write

jobs:
  radar-scan:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python 3.10 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装量化与数据分析依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import lightgbm, sklearn; print('lightgbm', lightgbm.__version__); print('sklearn', sklearn.__version__)"

      - name: 🛡️ 本地优先检测 (仅本仓库非 Actions 提交；忽略上游继承)
        id: check_local
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_FORK_PARENT: ${{ github.event.repository.parent.full_name }}
          RADAR_REPO_IS_FORK: ${{ github.event.repository.fork }}
        run: python radar_cloud_sync.py --check-local-client

      - name: 读取当前仓库 Pages 发布方式
        id: pages_mode
        if: steps.check_local.outputs.skip_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bt=$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type' || echo unknown)
          case "$bt" in
            legacy|workflow) ;;
            *) bt=unknown ;;
          esac
          echo "build_type=$bt" >> "$GITHUB_OUTPUT"
          echo "Pages build_type=$bt （legacy=从分支部署，workflow=GitHub Actions 产物部署）"

      - name: 🚀 执行全市场 65 只标的极速扫描与微信告警
        if: steps.check_local.outputs.skip_run != 'true'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_FORK_PARENT: ${{ github.event.repository.parent.full_name }}
          RADAR_REPO_IS_FORK: ${{ github.event.repository.fork }}
          RADAR_PAGES_BUILD_TYPE: ${{ steps.pages_mode.outputs.build_type }}
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          EVENT_NAME="${{ github.event_name }}"
          DURATION="${{ github.event.inputs.duration_minutes }}"
          INTERVAL="${{ github.event.inputs.interval_seconds }}"
          # 定时任务不读手动输入，维持盘中 240 分钟守护。手动默认 0 = 一轮后发布 Pages。
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            DURATION="240"
          fi
          [ -z "$DURATION" ] && DURATION="0"
          [ -z "$INTERVAL" ] && INTERVAL="60"
          if ! DURATION_NUM=$((10#$DURATION)) 2>/dev/null; then
            echo "duration_minutes=$DURATION 不是非负整数，按 0（单轮）处理"
            DURATION_NUM=0
          fi
          # 如果是夜盘亚太时段 (UTC 00:00~08:00 / 韩国 09:00~17:00)，自适应切为 2 分钟 (120s) 巡检守护
          if [ "${{ github.event.schedule }}" = "0 0 * * 1-5" ] || [ "${{ github.event.schedule }}" = "0 4 * * 1-5" ]; then
            INTERVAL="120"
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DURATION_NUM" -eq 0 ]; then
            echo "手动触发：单轮快刷后退出，以便立刻发布 Pages。需要长驻请把 duration_minutes 设为正整数。"
            python integrated_market_radar.py --loop-daemon --max-rounds 1 --interval-seconds "$INTERVAL"
          else
            python integrated_market_radar.py --loop-daemon --duration-minutes "$DURATION_NUM" --interval-seconds "$INTERVAL"
          fi

      # GitHub Actions source: publish the HTML this run just wrote.
      # Deploy from a branch keeps working via POST /pages/builds inside the
      # daemon, so this step is skipped unless the source is already workflow.
      - name: 组装 Pages 静态站点
        id: pages_site
        if: steps.check_local.outputs.skip_run != 'true' && steps.pages_mode.outputs.build_type == 'workflow'
        run: |
          mkdir -p _pages_site
          copied=0
          for f in index.html futu_pro_terminal.html macro_radar.html stocks_radar.html predict_radar_5y.html backtest_report_5y.html .nojekyll; do
            if [ -f "$f" ]; then
              cp "$f" _pages_site/
              copied=$((copied + 1))
            fi
          done
          echo "copied=$copied" >> "$GITHUB_OUTPUT"
          test "$copied" -gt 0

      - name: 上传 Pages artifact
        if: steps.check_local.outputs.skip_run != 'true' && steps.pages_mode.outputs.build_type == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages_site

      - name: 部署 Pages artifact
        id: deployment
        if: steps.check_local.outputs.skip_run != 'true' && steps.pages_mode.outputs.build_type == 'workflow'
        uses: actions/deploy-pages@v4
